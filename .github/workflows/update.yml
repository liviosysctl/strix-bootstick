# Every week and on demand: the newest Rust and the newest crates. Committed in
# Livio's name and pushed only when formatting, lints and tests pass on Linux
# and the Windows build still compiles. New major versions of crates are not
# taken automatically (they can break the code); cargo update moves
# everything within the versions in Cargo.toml.
name: Update

on:
  schedule:
    - cron: "53 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: rustup component add rustfmt clippy && rustup target add x86_64-pc-windows-gnu
      # The app's icon and manifest are compiled into it with windres, also
      # when the Windows build is only checked from Linux; Slint finds fonts
      # through fontconfig
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 libfontconfig-dev

      - name: Update
        id: update
        run: |
          git config user.name "Liviosysctl"
          git config user.email "livio.deganutti@pm.me"
          cargo update 2>&1 | tee update.log
          if git diff --quiet; then
            echo "Everything is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "build: update crates"
            echo
            grep -E "Updating|Adding|Removing" update.log | sed 's/^/    /' || true
          } > message.txt
          git commit -a -F message.txt
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - if: steps.update.outputs.changed == 'true'
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings
          cargo test --workspace

      - if: steps.update.outputs.changed == 'true'
        run: git push origin HEAD:main
