# Creates the GitHub release for every pushed version tag (v1.2.3) and
# attaches the app, strix-bootstick.exe, built from that tag.
# The notes come from cliff.toml, so they look exactly like CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Drop the version heading (the release title shows it)
        run: sed -i '0,/^## /{/^## /d}' RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md

  app:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: cargo build --release -p bootstick-app
      - run: gh release upload ${{ github.ref_name }} target/release/strix-bootstick.exe
        env:
          GH_TOKEN: ${{ github.token }}
