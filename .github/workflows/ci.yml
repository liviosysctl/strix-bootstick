# On every push and pull request: formatting, lints and tests on Linux (the
# parts that are not Windows-specific), then the Windows build with its own
# lints and tests. The Windows run starts what it built, once, on the runner
# (the command line against the real release, the app's window), and keeps
# strix-bootstick.exe (the app) and bootstick.exe (the command line) as an
# artifact (Actions, the run, "Artifacts") for a real machine.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Always the newest stable Rust, not whatever the runner image has
      - run: rustup update stable && rustup default stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p bootstick-app -p bootstick-cli

      - name: The command line reads the release and the disks of the runner
        run: |
          target/release/bootstick.exe manifest
          target/release/bootstick.exe disks

      # The runner has a desktop and the WebView2 runtime: the window must
      # open and stay open. Its picture is kept next to the programs.
      - name: The app opens its window
        shell: pwsh
        run: |
          $app = Start-Process -FilePath target/release/strix-bootstick.exe -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "the app ended by itself with code $($app.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $picture = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($picture).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $picture.Save("$PWD/window.png")
          Stop-Process -Id $app.Id

      - uses: actions/upload-artifact@v7
        with:
          name: strix-bootstick-${{ github.sha }}
          path: |
            target/release/strix-bootstick.exe
            target/release/bootstick.exe
            window.png
          retention-days: 14

  # The whole way on a real Windows: download the release, write it, read it
  # back, set the boot entry. The runner has no USB port, so a virtual disk
  # with a volume on it stands in for the stick; the feature virtual-disks
  # lets this one build accept it, the programs above never do.
  stick:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: cargo build --release -p bootstick-cli --features virtual-disks

      - name: Attach a virtual disk with a volume, like a stick in use
        shell: pwsh
        run: |
          @(
            "create vdisk file=$env:RUNNER_TEMP\stick.vhd maximum=4096 type=expandable",
            "attach vdisk",
            "create partition primary",
            "format fs=fat32 quick label=STICK",
            "assign letter=S"
          ) | Set-Content diskpart.txt
          diskpart /s diskpart.txt
          $disk = (Get-Disk | Where-Object BusType -eq 'File Backed Virtual').Number
          "DISK=$disk" >> $env:GITHUB_ENV
          Set-Content S:\holiday.txt "what a stick has on it"

      - run: target/release/bootstick.exe disks
      - run: target/release/bootstick.exe flash --disk $env:DISK --yes
        shell: pwsh

      - name: The disk now has the partitions of the image
        shell: pwsh
        run: |
          Get-Partition -DiskNumber $env:DISK | Format-Table PartitionNumber, Type, Size
          if (Test-Path S:\holiday.txt) { throw "the old volume is still there" }
