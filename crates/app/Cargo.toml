[package]
name = "bootstick-app"
description = "The window of the bootstick app: plug in a stick, press one button"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "strix-bootstick"
path = "src/main.rs"

[dependencies]
bootstick-core = { path = "../core" }
# Pure Rust: winit for the window, FemtoVG on OpenGL, the software renderer
# when there is no usable OpenGL (old graphics, virtual machines)
slint = { version = "1.19", default-features = false, features = [
  "std",
  "compat-1-2",
  "accessibility",
  "backend-winit",
  "renderer-femtovg",
  "renderer-software",
] }

[build-dependencies]
slint-build = "1.19"
# Icon and manifest into the .exe, see build.rs
embed-resource = "3"
