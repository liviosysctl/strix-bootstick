[package]
name = "bootstick-core"
description = "Download a release ISO, write it to a USB stick and boot from it once"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

# Windows uses its own TLS (schannel) and certificate store: no C compiler
# needed to build, and school or company proxies with their own certificates
# work like in the browser. Elsewhere (tests, development) rustls.
[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3", features = ["platform-verifier"] }

[target.'cfg(windows)'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
