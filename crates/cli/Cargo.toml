[package]
name = "bootstick-cli"
description = "Command line front end of the bootstick core, for testing without the app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "bootstick"
path = "src/main.rs"

[dependencies]
bootstick-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
